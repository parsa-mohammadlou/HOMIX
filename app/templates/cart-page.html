{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
    background-attachment: fixed;
    color: #1e293b;
    padding-bottom: 90px;
  }

  /* ==================== هدر ==================== */
  .header {
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
  }

  .brand-logo svg {
    width: 22px;
    height: 22px;
    stroke: #ffffff;
  }

  .brand-name {
    font-size: 16px;
    font-weight: 700;
    color: #1e293b;
  }

  .brand-sub {
    font-size: 12px;
    color: #64748b;
  }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 10px;
    background: #fff1f1;
    color: #d93025;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: #ffe1e1;
  }

  .logout-btn svg {
    width: 16px;
    height: 16px;
    stroke: #d93025;
  }

  /* ==================== محتوا ==================== */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
  }

  /* عنوان صفحه */
  .page-header {
    background: #ffffff;
    border-radius: 20px;
    padding: 26px 30px;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10),
                0 4px 12px rgba(37, 99, 235, 0.05);
    position: relative;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .page-header::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 5px;
    background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
  }

  .page-header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .page-desc {
    font-size: 13.5px;
    color: #64748b;
  }

  .item-count {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 13.5px;
    font-weight: 600;
  }

  .item-count svg {
    width: 18px;
    height: 18px;
    stroke: #2563eb;
  }

  /* ==================== لیست محصولات ==================== */
  .cart-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .cart-item {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px 22px;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    flex-wrap: wrap;
  }

  .cart-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(37, 99, 235, 0.15);
  }

  .item-info {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }

  .item-image {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .item-image svg {
    width: 28px;
    height: 28px;
    stroke: #2563eb;
  }

  .item-details {
    min-width: 0;
    flex: 1;
  }

  .item-name {
    font-size: 14.5px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .item-price {
    font-size: 13px;
    color: #64748b;
  }

  .item-price strong {
    color: #2563eb;
    font-weight: 700;
    font-size: 14px;
  }

  /* بخش کنترل تعداد */
  .item-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .quantity-control {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f8fafc;
    border-radius: 10px;
    padding: 4px;
  }

  .quantity-control button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 8px;
    background: #ffffff;
    color: #2563eb;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.08);
  }

  .quantity-control button:hover {
    background: #eff6ff;
  }

  .quantity-control button:active {
    transform: scale(0.95);
  }

  .quantity-control .qty-value {
    min-width: 32px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: #1e293b;
  }

  .item-total {
    font-size: 14.5px;
    font-weight: 700;
    color: #1e293b;
    min-width: 110px;
    text-align: left;
  }

  /* دکمه حذف */
  .remove-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #fff1f1;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .remove-btn svg {
    width: 16px;
    height: 16px;
    stroke: #d93025;
  }

  .remove-btn:hover {
    background: #ffe1e1;
  }

  /* ==================== خلاصه سفارش ==================== */
  .summary-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10),
                0 4px 12px rgba(37, 99, 235, 0.05);
  }

  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 14px;
  }

  .summary-row:not(:last-child) {
    border-bottom: 1px solid #f1f5f9;
  }

  .summary-label {
    color: #64748b;
    font-weight: 500;
  }

  .summary-value {
    color: #1e293b;
    font-weight: 600;
  }

  .summary-value.total {
    color: #2563eb;
    font-size: 18px;
    font-weight: 700;
  }

  .checkout-btn {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkout-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
  }

  .checkout-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }

  .checkout-btn svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
  }

  /* ==================== سبد خالی ==================== */
  .empty-cart {
    background: #ffffff;
    border-radius: 20px;
    padding: 60px 30px;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.10);
    text-align: center;
  }

  .empty-cart-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 24px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-cart-icon svg {
    width: 40px;
    height: 40px;
    stroke: #2563eb;
  }

  .empty-cart h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 8px;
  }

  .empty-cart p {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
  }

  .empty-cart-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.25s ease;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
  }

  .empty-cart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
  }

  .empty-cart-btn svg {
    width: 18px;
    height: 18px;
    stroke: #ffffff;
  }

  /* ==================== منوی موبایل ==================== */
  .mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
    box-shadow: 0 -4px 20px rgba(37, 99, 235, 0.08);
    z-index: 200;
    padding: 8px 0;
  }

  .mobile-nav-inner {
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .mobile-nav a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 12px;
    text-decoration: none;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 500;
    transition: color 0.2s;
    border-radius: 10px;
    position: relative;
  }

  .mobile-nav a svg {
    width: 22px;
    height: 22px;
    stroke: #94a3b8;
    transition: stroke 0.2s;
  }

  .mobile-nav a.active,
  .mobile-nav a:hover {
    color: #2563eb;
  }

  .mobile-nav a.active svg,
  .mobile-nav a:hover svg {
    stroke: #2563eb;
  }

  .mobile-nav a.logout-mobile:hover {
    color: #d93025;
  }

  .mobile-nav a.logout-mobile:hover svg {
    stroke: #d93025;
  }

  .mobile-cart-badge {
    position: absolute;
    top: 0;
    left: 8px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==================== ریسپانسیو ==================== */
  @media (max-width: 768px) {
    .brand-sub {
      display: none;
    }

    .mobile-nav {
      display: block;
    }

    .page-header {
      padding: 22px;
    }

    .page-title {
      font-size: 18px;
    }

    .container {
      padding: 20px 16px;
    }
  }

  @media (max-width: 560px) {
    .cart-item {
      padding: 16px;
      flex-direction: column;
      align-items: flex-start;
    }

    .item-info {
      width: 100%;
    }

    .item-actions {
      width: 100%;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .item-total {
      min-width: auto;
      font-size: 14px;
    }

    .item-count {
      width: 100%;
      justify-content: center;
    }

    .summary-card {
      padding: 20px 22px;
    }

    .empty-cart {
      padding: 45px 22px;
    }

    .empty-cart-icon {
      width: 70px;
      height: 70px;
    }

    .empty-cart-icon svg {
      width: 34px;
      height: 34px;
    }
  }
</style>
</head>
