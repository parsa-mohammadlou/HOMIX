<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ساخت حساب کاربری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
    padding: 20px;
  }

  /* کارت ثبت‌نام */
  .register-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 45px 35px;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.12),
                0 4px 12px rgba(37, 99, 235, 0.06);
    position: relative;
    overflow: hidden;
  }

  /* نوار تزئینی بالای کارت */
  .register-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 5px;
    background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
  }

  /* آیکون لوگو */
  .logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
  }

  .logo-circle {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    transform: rotate(-5deg);
  }

  .logo-circle svg {
    width: 36px;
    height: 36px;
    stroke: #ffffff;
    transform: rotate(5deg);
  }

  /* عنوان‌ها */
  .register-title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 8px;
  }

  .register-subtitle {
    text-align: center;
    font-size: 14px;
    color: #64748b;
    margin-bottom: 35px;
  }

  /* گروه فیلدها */
  .input-group {
    margin-bottom: 20px;
    position: relative;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    margin-bottom: 8px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper svg.input-icon {
    position: absolute;
    right: 15px;
    width: 20px;
    height: 20px;
    stroke: #94a3b8;
    pointer-events: none;
    transition: stroke 0.2s;
  }

  .input-group input {
    width: 100%;
    padding: 14px 48px 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #1e293b;
    background: #f8fafc;
    transition: all 0.25s ease;
    outline: none;
  }

  .input-group input::placeholder {
    color: #94a3b8;
  }

  .input-group input:hover {
    border-color: #cbd5e1;
  }

  .input-group input:focus {
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
  }

  .input-group input:focus ~ svg.input-icon {
    stroke: #3b82f6;
  }

  /* دکمه نمایش رمز عبور */
  .toggle-password {
    position: absolute;
    left: 12px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .toggle-password:hover {
    background: #eff6ff;
  }

  .toggle-password svg {
    width: 18px;
    height: 18px;
    stroke: #94a3b8;
    transition: stroke 0.2s;
  }

  .toggle-password:hover svg {
    stroke: #3b82f6;
  }

  /* دکمه ثبت‌نام */
  .register-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    margin-top: 5px;
  }

  .register-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
  }

  .register-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }

  /* لینک ورود */
  .login-link {
    text-align: center;
    margin-top: 25px;
    font-size: 13.5px;
    color: #64748b;
  }

  .login-link a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
  }

  .login-link a:hover {
    color: #1d4ed8;
    text-decoration: underline;
  }

  /* پیام خطا */
  .error-message {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #fff1f1;
    border: 1px solid #ffcaca;
    color: #d93025;
    font-size: 13px;
    text-align: center;
  }

  /* پیام موفقیت */
  .success-message {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #16a34a;
    font-size: 13px;
    text-align: center;
  }

  /* ریسپانسیو */
  @media (max-width: 480px) {
    .register-card {
      padding: 35px 25px;
      border-radius: 16px;
    }
    .register-title { font-size: 21px; }
  }
</style>
</head>
<body>

  <div class="register-card">
    
    <!-- لوگو -->
    <div class="logo-wrapper">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
    </div>

    <!-- عنوان -->
    <h1 class="register-title">ساخت حساب کاربری 🎉</h1>
    <p class="register-subtitle">برای ایجاد حساب جدید، اطلاعات زیر را تکمیل کنید</p>

    <!-- پیام خطا -->
    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <!-- پیام موفقیت -->
    {% if success %}
        <div class="success-message">
            {{ success }}
        </div>
    {% endif %}

    <!-- فرم -->
    <form method="post">
      {% csrf_token %}

      <!-- نام کاربری -->
      <div class="input-group">
        <label for="username">نام کاربری</label>
        <div class="input-wrapper">
          <input 
            type="text"
            name="username"  
            id="username" 
            placeholder="یک نام کاربری انتخاب کنید"
            autocomplete="username"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- ایمیل -->
      <div class="input-group">
        <label for="email">ایمیل</label>
        <div class="input-wrapper">
          <input 
            type="email"
            name="email"  
            id="email" 
            placeholder="ایمیل خود را وارد کنید"
            autocomplete="email"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
      </div>

      <!-- رمز عبور -->
      <div class="input-group">
        <label for="password">رمز عبور</label>
        <div class="input-wrapper">
          <input 
            type="password"
            name="password" 
            id="password" 
            placeholder="رمز عبور خود را وارد کنید"
            autocomplete="new-password"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-password" onclick="togglePassword('password', 'eye-icon-1')" aria-label="نمایش رمز عبور">
            <svg id="eye-icon-1" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- تکرار رمز عبور -->
      <div class="input-group">
        <label for="password_confirm">تکرار رمز عبور</label>
        <div class="input-wrapper">
          <input 
            type="password"
            name="password_confirm" 
            id="password_confirm" 
            placeholder="رمز عبور را دوباره وارد کنید"
            autocomplete="new-password"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-password" onclick="togglePassword('password_confirm', 'eye-icon-2')" aria-label="نمایش رمز عبور">
            <svg id="eye-icon-2" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- دکمه ثبت‌نام -->
       
      <button type="submit" class="register-btn">ساخت حساب کاربری</button>

    </form>

    <!-- لینک ورود -->
    <p class="login-link">
      قبلاً حساب کاربری دارید؟ <a href="{% url 'loginuser' %}">وارد شوید</a>
    </p>

  </div>

<script>
  function togglePassword(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const eyeIcon = document.getElementById(iconId);
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      `;
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
    }
  }
</script>

</body>
</html>
