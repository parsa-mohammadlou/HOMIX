<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title style="color: green;">Welcome to Geeksforgeeks ????</title>
    <style>
        .container {
            text-align: center;
            margin: 100px auto;
            max-width: 500px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: green;
            font-weight: bold;
        }

        img {
            width: 60%;
        }


        /* ===== دکمه خروج ===== */
        .logout-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: #ffffff;
            color: #dc2626;
            border: 2px solid #fecaca;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
            transition: all 0.25s ease;
            z-index: 100;
        }

        .logout-btn svg {
            width: 18px;
            height: 18px;
            stroke: #dc2626;
            transition: stroke 0.25s ease;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35);
        }

        .logout-btn:hover svg {
            stroke: #ffffff;
        }

        .logout-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page heading -->
        <h1>Welcome to Geeksforgeeks </h1>
        
        <!-- Animated GIF -->
        <!-- Use "welcome.gif" as the source for the GIF -->
        <img src="https://i.ibb.co/RNB6jpM/welcome.gif" alt="Welcome Cartoon">
    </div>
      <!-- دکمه خروج -->
  <a href="{% url 'logoutuser' %}" class="logout-btn" onclick="return confirm('آیا از حساب کاربری خارج می‌شوید؟')">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    خروج
  </a>
</body>
</html>
