<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اضافه کردن کالای جدید</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #ffffff 100%);
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ===== دکمه بازگشت ===== */
  .back-btn {
    position: fixed;
    top: 25px;
    right: 25px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: #ffffff;
    color: #2563eb;
    border: 2px solid #dbeafe;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    transition: all 0.25s ease;
    z-index: 100;
  }

  .back-btn svg {
    width: 18px;
    height: 18px;
    stroke: #2563eb;
    transition: stroke 0.25s ease;
  }

  .back-btn:hover {
    background: #2563eb;
    color: #ffffff;
    border-color: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }

  .back-btn:hover svg {
    stroke: #ffffff;
  }

  /* ===== کارت فرم ===== */
  .form-card {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    border-radius: 22px;
    padding: 40px 38px;
    box-shadow: 0 20px 50px rgba(37, 99, 235, 0.12),
                0 4px 12px rgba(37, 99, 235, 0.06);
    position: relative;
    overflow: hidden;
  }

  /* نوار تزئینی بالا */
  .form-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 5px;
    background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
  }

  /* ===== هدر فرم ===== */
  .form-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .header-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    flex-shrink: 0;
  }

  .header-icon svg {
    width: 28px;
    height: 28px;
    stroke: #ffffff;
    stroke-width: 2;
  }

  .form-title {
    font-size: 24px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .form-subtitle {
    font-size: 13.5px;
    color: #64748b;
  }

  /* خط جداکننده */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
    margin: 25px 0 30px;
  }

  /* ===== گرید فرم ===== */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .form-group label .required {
    color: #dc2626;
    font-size: 15px;
  }

  /* ===== ورودی‌ها ===== */
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper svg.input-icon {
    position: absolute;
    right: 15px;
    width: 19px;
    height: 19px;
    stroke: #94a3b8;
    pointer-events: none;
    transition: stroke 0.2s;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 13px 46px 13px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #1e293b;
    background: #f8fafc;
    transition: all 0.25s ease;
    outline: none;
  }

  .form-group textarea {
    padding: 13px 16px;
    resize: vertical;
    min-height: 100px;
    line-height: 1.7;
  }

  .form-group select {
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: left 15px center;
    background-size: 18px;
    padding-left: 45px;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: #94a3b8;
  }

  .form-group input:hover,
  .form-group select:hover,
  .form-group textarea:hover {
    border-color: #cbd5e1;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: #3b82f6;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
  }

  .form-group input:focus ~ svg.input-icon {
    stroke: #3b82f6;
  }

  /* ===== آپلود عکس ===== */
  .image-upload {
    width: 100%;
    border: 2px dashed #cbd5e1;
    border-radius: 14px;
    background: #f8fafc;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .image-upload:hover {
    border-color: #3b82f6;
    background: #eff6ff;
  }

  .image-upload.dragover {
    border-color: #2563eb;
    background: #dbeafe;
    transform: scale(1.01);
  }

  .image-upload input[type="file"] {
    display: none;
  }

  .upload-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #dbeafe, #eff6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .upload-icon svg {
    width: 26px;
    height: 26px;
    stroke: #2563eb;
    stroke-width: 2;
  }

  .image-upload:hover .upload-icon {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    transform: scale(1.08);
  }

  .image-upload:hover .upload-icon svg {
    stroke: #ffffff;
  }

  .upload-title {
    font-size: 14px;
    font-weight: 600;
    color: #334155;
  }

  .upload-title span {
    color: #2563eb;
    text-decoration: underline;
  }

  .upload-hint {
    font-size: 12px;
    color: #94a3b8;
  }

  /* پیش‌نمایش عکس */
  .image-preview {
    display: none;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid #dbeafe;
  }

  .image-preview img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
  }

  .remove-image {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(220, 38, 38, 0.95);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
  }

  .remove-image svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
    stroke-width: 2.5;
  }

  .remove-image:hover {
    background: #dc2626;
    transform: scale(1.1);
  }

  /* ===== دکمه‌های فرم ===== */
  .form-actions {
    display: flex;
    gap: 14px;
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid #f1f5f9;
  }

  .btn {
    flex: 1;
    padding: 14px 20px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }

  .btn svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
  }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    flex: 2;
  }

  .btn-primary svg {
    stroke: #ffffff;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  }

  .btn-secondary {
    background: #ffffff;
    color: #64748b;
    border: 2px solid #e2e8f0;
  }

  .btn-secondary svg {
    stroke: #64748b;
  }

  .btn-secondary:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #334155;
  }

  .btn-secondary:hover svg {
    stroke: #334155;
  }

  /* ===== پیام موفقیت ===== */
  .success-message {
    display: none;
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #ffffff;
    color: #16a34a;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(22, 163, 74, 0.2);
    border: 2px solid #bbf7d0;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 200;
    transition: transform 0.4s ease;
    opacity: 0;
  }

  .success-message.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .success-message svg {
    width: 20px;
    height: 20px;
    stroke: #16a34a;
    stroke-width: 2.5;
  }

  /* ===== ریسپانسیو ===== */
  @media (max-width: 640px) {
    .form-card {
      padding: 30px 22px;
      border-radius: 18px;
    }
    .form-title {
      font-size: 20px;
    }
    .form-grid {
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .back-btn {
      top: 15px;
      right: 15px;
      padding: 8px 14px;
      font-size: 13px;
    }
    .form-actions {
      flex-direction: column-reverse;
    }
    .header-icon {
      width: 48px;
      height: 48px;
    }
    .header-icon svg {
      width: 24px;
      height: 24px;
    }
  }
</style>
</head>
<body>

  <!-- دکمه بازگشت -->
  <a href="{% url 'panel' %}" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    بازگشت به پنل
  </a>

  <!-- پیام موفقیت -->
  <div class="success-message" id="successMsg">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    کالا با موفقیت اضافه شد!
  </div>

  <!-- کارت فرم -->
  <div class="form-card">

    <!-- هدر -->
    <div class="form-header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <div>
        <h1 class="form-title">اضافه کردن کالای جدید</h1>
        <p class="form-subtitle">اطلاعات کالا را با دقت وارد کنید</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- فرم -->
    <!-- <form id="productForm" method="post" onsubmit="handleSubmit(event)"> -->
    <form 
        id="productForm" 
        method="post" 
        enctype="multipart/form-data"
        
    >
    <!-- onsubmit="handleSubmit(event)" -->
    {% csrf_token %}

      <div class="form-grid">

        <!-- نام کالا -->
        <div class="form-group full-width">
          <label for="productName">
            نام کالا <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="text"
                name="productName"
              id="productName" 
              placeholder="مثلاً: یخچال سامسونگ مدل WH-1000XM5"
              required
            >
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 7h-9"/>
              <path d="M14 17H5"/>
              <circle cx="17" cy="17" r="3"/>
              <circle cx="7" cy="7" r="3"/>
            </svg>
          </div>
        </div>

        <!-- برند -->
        <div class="form-group">
          <label for="brand">
            برند <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="text"
              name="brand"  
              id="brand" 
              placeholder="مثلاً: Sony"
              required
            >
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
          </div>
        </div>

        <!-- دسته -->
        <div class="form-group">
          <label for="category">
            دسته‌بندی <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <select name="category" id="category" required>
              <option value="" disabled selected>انتخاب کنید...</option>
              <option value="یخچال">یخچال</option>
                <option value="تلویزیون">تلویزیون</option>
                <option value="کولر">کولر</option>
                <option value="ماشین لباسشویی">ماشین لباسشویی</option>
                <option value="جاروبرقی">جاروبرقی</option>
                <option value="مایکروویو">مایکروویو</option>
            </select>
          </div>
        </div>

        <!-- قیمت -->
        <div class="form-group">
          <label for="price">
            قیمت (تومان) <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="number"
              name="price" 
              id="price" 
              placeholder="0"
              min="0"
              step="1000"
              required
            >
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
        </div>

        <!-- تعداد موجودی -->
        <div class="form-group">
          <label for="stock">
            تعداد موجودی <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input 
              type="number" 
              name="stock"
              id="stock" 
              placeholder="0"
              min="0"
              required
            >
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </div>
        </div>

        <!-- توضیحات -->
        <div class="form-group full-width">
          <label for="description">توضیحات</label>
          <textarea
            name="description"
            id="description" 
            placeholder="توضیحات کامل درباره کالا، ویژگی‌ها، مشخصات فنی و ..."
          ></textarea>
        </div>

        <!-- عکس کالا -->
        <div class="form-group full-width">
          <label>عکس کالا</label>
          
          <!-- منطقه آپلود -->
          <div class="image-upload" id="uploadArea" onclick="document.getElementById('imageInput').click()">
            <input type="file" name="image" id="imageInput" accept="image/*" onchange="handleImage(event)">
            <div class="upload-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
            </div>
            <div class="upload-title">
              عکس را اینجا بکشید یا <span>انتخاب کنید</span>
            </div>
            <div class="upload-hint">PNG، JPG یا WEBP — حداکثر ۵ مگابایت</div>
          </div>

          <!-- پیش‌نمایش -->
          <div class="image-preview" id="imagePreview">
            <img id="previewImg" src="" alt="پیش‌نمایش">
            <button type="button" class="remove-image" onclick="removeImage(event)" aria-label="حذف عکس">
              <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>

      </div>

      <!-- دکمه‌ها -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="resetForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          پاک کردن
        </button>
        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          ذخیره کالا
        </button>
      </div>

    </form>

  </div>

<script>
  const uploadArea = document.getElementById('uploadArea');
  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');
  const previewImg = document.getElementById('previewImg');

  // Drag & Drop
  ['dragenter', 'dragover'].forEach(evt => {
    uploadArea.addEventListener(evt, e => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(evt => {
    uploadArea.addEventListener(evt, e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
    });
  });

  uploadArea.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      imageInput.files = e.dataTransfer.files;
      showPreview(file);
    }
  });

  // نمایش پیش‌نمایش
  function handleImage(event) {
    const file = event.target.files[0];
    if (file) showPreview(file);
  }

  function showPreview(file) {
    const reader = new FileReader();
    reader.onload = e => {
      previewImg.src = e.target.result;
      uploadArea.style.display = 'none';
      imagePreview.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  // حذف عکس
  function removeImage(event) {
    event.stopPropagation();
    imageInput.value = '';
    previewImg.src = '';
    imagePreview.style.display = 'none';
    uploadArea.style.display = 'flex';
  }

  // پاک کردن فرم
  function resetForm() {
    if (confirm('آیا از پاک کردن فرم مطمئن هستید؟')) {
      document.getElementById('productForm').reset();
      removeImage({ stopPropagation: () => {} });
    }
  }

  // ارسال فرم
  function handleSubmit(event) {
    event.preventDefault();
    
    // نمایش پیام موفقیت
    const successMsg = document.getElementById('successMsg');
    successMsg.classList.add('show');
    
    setTimeout(() => {
      successMsg.classList.remove('show');
    }, 3000);

    // اینجا می‌تونی داده‌ها رو به سرور بفرستی
    // const formData = new FormData(event.target);
    // fetch('/api/products', { method: 'POST', body: formData });

    // ریست فرم بعد از ۱ ثانیه
    setTimeout(() => {
      event.target.reset();
      removeImage({ stopPropagation: () => {} });
    }, 1000);
  }
</script>

</body>
</html>
